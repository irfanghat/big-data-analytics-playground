name: big-data-analytics-playground

x-hadoop: &hadoop
  image: apache/hadoop:${HADOOP_VERSION}
  env_file: ./hadoop.env
  networks: [lake]

services:
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"
      - "8020:8020"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/namenode/8020'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  datanode:
    <<: *hadoop
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy

  hdfs-init:
    <<: *hadoop
    container_name: hdfs-init
    depends_on:
      namenode:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - |
        hdfs dfsadmin -safemode wait &&
        hdfs dfs -mkdir -p /user/hive/warehouse /tmp &&
        hdfs dfs -chmod -R 777 /user/hive/warehouse /tmp

  metastore:
    image: apache/hive:${HIVE_VERSION}
    container_name: metastore
    hostname: metastore
    restart: unless-stopped
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      datanode:
        condition: service_started
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      SERVICE_OPTS: "-Dderby.stream.error.file=/tmp/derby.log"
    ports:
      - "9083:9083"
    volumes:
      - ./conf/hive-site-metastore.xml:/opt/hive/conf/hive-site.xml:ro
    networks: [lake]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  hiveserver2:
    image: apache/hive:${HIVE_VERSION}
    container_name: hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    depends_on:
      metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Xmx1G"
      IS_RESUME: "true"
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./conf/hive-site-client.xml:/opt/hive/conf/hive-site.xml:ro
    networks: [lake]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  spark-master:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-master
    hostname: spark-master
    depends_on:
      metastore:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      HADOOP_USER_NAME: root
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./conf/hive-site-client.xml:/opt/spark/conf/hive-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks: [lake]

  spark-worker:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-worker
    hostname: spark-worker
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2g"]
    environment:
      HADOOP_USER_NAME: root
    ports:
      - "8081:8081"
    volumes:
      - ./conf/hive-site-client.xml:/opt/spark/conf/hive-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks: [lake]

networks:
  lake:
    name: lake